<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" type="image/png" href="./image/kakaotalk_20250308_170326905.png" />
  <style>
    /* 하단 고정 바 스타일 */
    .fixed-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #ffffff;
      color: white;
      padding: 0.1rem;
      text-align: center;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.3);
      z-index: 1000;
      padding-left:1rem;
      padding-right:1rem;
    }
    /* 로그인 모달 스타일 */
    #loginModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.7);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    .login-container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      width: 300px;
    }
    .login-container input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      box-sizing: border-box;
    }
    .login-container button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
  <title>온라인 출입 시스템</title>
</head>
<body>

  <!-- 로그인 모달 -->
  <div id="loginModal">
    <div class="login-container">
      <h2>선생님 로그인</h2>
      <!-- 이메일 입력창 복구 -->
      <input type="email" id="teacherEmail" placeholder="이메일">
      <!-- 비밀번호 힌트 문구 제거 -->
      <input type="password" id="teacherPassword" placeholder="비밀번호">
      <button id="loginBtn">로그인</button>
    </div>
  </div>

  <div id="content" style="display:none;">
    <h1>TEACHER | 선생님</h1>
    <div>
      <h2>카테고리</h2>
      <label for="studentDefGrade">학년:</label>
      <select id="studentDefGrade">
        <option value="">전체</option>
        <option value="7">7학년</option>
        <option value="8">8학년</option>
        <option value="9">9학년</option>
        <option value="10">10학년</option>
        <option value="11">11학년</option>
        <option value="12">12학년</option>
      </select>

      <label for="studentDefEnter">출입 여부:</label>
      <select id="studentDefEnter">
        <option value="">전체</option>
        <option value="true">허가됨</option>
        <option value="false">거부됨</option>
      </select>

      <label for="studentDefRequest">사용 상태:</label>
      <select id="studentDefRequest">
        <option value="">전체</option>
        <option value="used">사용 완료</option>
        <option value="unused">사용 안함</option>
      </select>

      <!-- 기존 레이아웃 유지 + 기간 선택으로 변경 -->
      <label for="studentDefStartDate">시작 날짜:</label>
      <input type="date" id="studentDefStartDate">

      <label for="studentDefEndDate">종료 날짜:</label>
      <input type="date" id="studentDefEndDate">

      <button id="saveCategory">검색</button>

      <div id="listBox">
        <h3>학생 목록</h3>
        <label><input type="checkbox" id="selectAll"> 전체 선택</label>
        <div id="listofStudents"></div>
        
        <div class="fixed-bottom-bar">
          <button id="save">선택한 학생 출입 허가</button>
        </div>
      </div>
    </div>
    
    <footer class="footer">
      <p>© 2026 Online Entry. All rights reserved.</p>
    </footer>
  </div>

  <script type="module" src="./script/app.js"></script>
  <script>
    // 비밀번호 입력창에서 엔터키 입력 시 로그인 클릭
    document.getElementById('teacherPassword')?.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('loginBtn')?.click();
      }
    });
  </script>
</body>
</html>
